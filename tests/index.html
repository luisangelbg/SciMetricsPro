<style>
  .test-report { max-width: 980px; margin: 0 auto; padding: 24px 20px 10px; font: 14px/1.5 system-ui, sans-serif; }
  .test-report h1 { margin: 0 0 4px; font-size: 1.4rem; }
  #summary { font-size: 1.1rem; font-weight: 700; margin: 8px 0 16px; padding: 10px 14px; border-radius: 10px; background: #e8eef7; }
  body.all-pass #summary { background: #dcf3e2; color: #1d6b31; }
  body.has-fail #summary { background: #fbe1dd; color: #9f2d22; }
  .suite h2 { font-size: 0.95rem; margin: 16px 0 4px; }
  .suite ul { list-style: none; margin: 0; padding: 0; }
  .suite li { padding: 2px 0; font-size: 0.86rem; }
  .suite li.pass { color: #1d6b31; }
  .suite li.fail { color: #9f2d22; font-weight: 600; }
  :root[data-theme="dark"] .suite li.pass { color: #5cc26f; }
  #resultJson { display: none; }
  .sandbox-note { max-width: 980px; margin: 30px auto 6px; padding: 0 20px; color: #5a6a81; font: 12px system-ui, sans-serif; }
  #app { min-height: auto; border-top: 3px dashed #b9c7da; }
</style>
</head>
